plugins { id 'com.android.application' }

android {
    namespace 'com.railpulse.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.railpulse.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
